<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: orange;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 0;
        }
        #blackground {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 10px;
            min-height: 100px;
            border-left: 5px solid orange;
            margin-top: 0;
        }
    </style>
</head>
<body>
    <button onclick="SubmitScore()">Run Code</button>
    <pre id="blackground">ผลลัพธ์จะแสดงที่นี่…</pre>
    <script>
        function SubmitScore() {
            let score = Math.ceil(Math.random()*100);
            const output = [];
            let text = "";
            let Grade = "";
            if (score >= 80){
                console.log("คะแนน: ",  score);
                output.push("คะแนน: "+ score);
                console.log("เกรด: A");
                output.push("เกรด: A");
                console.log("ผลสอบ: ผ่าน");
                output.push("ผลสอบ: ผ่าน");
                Grade = 1;
            }else if (score >=70){
                console.log("คะแนน: ",  score);
                output.push("คะแนน: "+ score);
                console.log("เกรด: B");
                output.push("เกรด: B");
                console.log("ผลสอบ: ผ่าน");
                output.push("ผลสอบ: ผ่าน");
                Grade = 2;
            }else if (score >=60){
                console.log("คะแนน: ",  score);
                output.push("คะแนน: "+ score);
                console.log("เกรด: C");
                output.push("เกรด: C");
                console.log("ผลสอบ: ผ่าน");
                output.push("ผลสอบ: ผ่าน");
                Grade = 3;
            }else if (score >=50){
                console.log("คะแนน: ",  score);
                output.push("คะแนน: "+ score);
                console.log("เกรด: D");
                output.push("เกรด: D");
                console.log("ผลสอบ: ผ่าน");
                output.push("ผลสอบ: ผ่าน");
                Grade = 4;
            }else{
                console.log("คะแนน: ", score);
                output.push("คะแนน: "+ score);
                console.log("เกรด: F");
                output.push("เกรด: F");
                console.log("ผลสอบ: ไม่ผ่าน");
                output.push("ผลสอบ: ไม่ผ่าน");
                Grade = 5;
            }
            switch (Grade) {
            case 1:
                text = "ยอดเยียมมาก";
                break;
            case 2:
                text = "ดีมาก รักษามาตรฐานไว้";
                break;
            case 3:
                text = "ผ่านเกณฑ์ระดับดี";
                break;
            case 4:
                text = "พอใช้ แต่ควรพัฒนาเพิ่ม";
                break;
            case 5:
                text = "ต้องลงทะเบียนเรียนใหม่";
                break;
            }
            console.log("คําอธิบาย: ", text);
            output.push("คําอธิบาย: "+ text);
            document.getElementById("blackground").textContent = output.join("\n");
        }
    </script>
</body>
</html>
