<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: rgb(31, 96, 170);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 0;
        }
        #blackground {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 10px;
            min-height: 100px;
            border-left: 5px solid #00c853;
            margin-top: 0;
        }
        input {
            padding: 5px 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid black;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <button onclick="SubmitScore()">Run Code</button>
    <input type="Number" id="Input" placeholder="Score" min="0" max="100" >
    <pre id="blackground">ผลลัพธ์จะแสดงที่นี่…</pre>
    <script>
        function SubmitScore() {
            let score = Number(document.getElementById("Input").value);
            const output = [];
            if (score >= 80){
                console.log("คะแนน: ",  score);
                output.push("คะแนน: "+ score);
                console.log("เกรด: A");
                output.push("เกรด: A");
                console.log("ผลสอบ: ผ่าน");
                output.push("ผลสอบ: ผ่าน");
            }else if (score >=70){
                console.log("คะแนน: ",  score);
                output.push("คะแนน: "+ score);
                console.log("เกรด: B");
                output.push("เกรด: B");
                console.log("ผลสอบ: ผ่าน");
                output.push("ผลสอบ: ผ่าน");
            }else if (score >=60){
                console.log("คะแนน: ",  score);
                output.push("คะแนน: "+ score);
                console.log("เกรด: C");
                output.push("เกรด: C");
                console.log("ผลสอบ: ผ่าน");
                output.push("ผลสอบ: ผ่าน");
            }else if (score >=50){
                console.log("คะแนน: ",  score);
                output.push("คะแนน: "+ score);
                console.log("เกรด: D");
                output.push("เกรด: D");
                console.log("ผลสอบ: ผ่าน");
                output.push("ผลสอบ: ผ่าน");
            }else{
                console.log("คะแนน: ", score);
                output.push("คะแนน: "+ score);
                console.log("เกรด: F");
                output.push("เกรด: F");
                console.log("ผลสอบ: ไม่ผ่าน");
                output.push("ผลสอบ: ไม่ผ่าน");
            }
            document.getElementById("blackground").textContent = output.join("\n");
        }
    </script>
</body>
</html>
