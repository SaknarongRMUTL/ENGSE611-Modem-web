<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --padding: 16px;
            --bg-color: #f0f0f0;
            --card-bg: #ffffff;
            --text-color: black;
        }
        @media (min-width: 768px){
            :root{
                --padding: 32px;
            }
        }
        body{
            margin: 0;
            font-family: Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        .container{
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--padding);
        }
        .card{
            background: var(--card-bg);
            padding: var(--padding);
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1)
        }
        h1{
            font-size: clamp(1.6rem, 4vw, 2.8rem);
            margin-top: 0;
        }
        p{
            font-size: clamp(1.6rem,2.5vw, 1.1rem);
            line-height: 1.6;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Modern CSS Features</h1>
            <p>
                ตัวอย่างการใช้ CSS Variables และฟังก์ชัน clamp() 
                เพื่อทำ Responsive Design โดยไม่ต้องใช้ media queries จำนวนมาก
            </p>
            <p>
                เมื่อขยายหน้าจอ ขนาดของตัวอักษรและระยะห่างจะปรับเปลี่ยนตามขนาดหน้าจอ
        </div>
    </div>
</body>
</html>
