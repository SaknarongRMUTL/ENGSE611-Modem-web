<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>ตัวอย่างการเขียน javascript แบบฝังใน HTML</h1>
    <button onclick="showMessage()">กดเพื่อแสดงข้อความ</button>
    <button onclick="runDemo()">Run Code</button>
    <script>
        function showMessage() {
            alert("สวัสดี! นี่คือข้อความจาก JavaScript"); 
            console.log("โค้ดกำลังRUN");
        }
        function runDemo() {
            console.clear();
            const output = [];
            let studentName = 'สมชาย ใจดี';
            let age = 20;
            let isEnrolled = true;
            const universityName = 'มหาวิทยาลัยตัวอย่าง';
            output.push("ชื่อนักศึกษา: ", +studentName);
            console.log("ชื่อนักศึกษา: " ,studentName);
            output.push("อายุ: " + age);
            console.log("อายุ: " + age);
            age =21;
            output.push("อายุใหม่: " + age);
            console.log("อายุใหม่: " + age);
            try {
                universityName = 'มหาวิทยาลัยใหม่';
            } catch (error) {
                output.push("Error: "+ error.message);
                console.error(error.message);
            }
            document.getElementById("outputbox").textContent = output.join("\n");
        }
    </script>
</body>
</html>
